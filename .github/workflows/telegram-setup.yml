name: Configurar webhook de Telegram

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL base (vacío = https://opoalerta.es)"
        required: false

permissions:
  contents: read

concurrency:
  group: telegram-webhook-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: setWebhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          INPUT_SITE_URL: ${{ inputs.site_url }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 scrapers/configurar_telegram.py
