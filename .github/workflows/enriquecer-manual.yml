name: Enriquecer plazos (manual)

on:
  workflow_dispatch:
    inputs:
      reprocesar:
        description: "Reevaluar las recientes (limpia plazo_texto y recalcula tras cambiar el extractor)"
        type: boolean
        default: false

jobs:
  enriquecer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - name: Tailscale (Postgres del VPS)
        # La base vive en un VPS y solo escucha en la red privada de Tailscale.
        # tag:ci solo puede llegar al 5432 de ese servidor (política del tailnet).
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"
      - name: Enriquecer plazos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLAZO_BATCH: "150"
        run: |
          ARGS=""
          if [ "${{ inputs.reprocesar }}" = "true" ]; then ARGS="--reprocesar"; fi
          python -m enriquecer $ARGS
