name: Ingesta diaria

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC diario
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    strategy:
      fail-fast: false
      matrix:
        fuente: [boe, boja, bocm, bocyl, boa, boib]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"

      - name: Ejecutar scraper ${{ matrix.fuente }}
        env:
          # Con el secret, la ingesta escribe en Postgres; sin él, dry-run.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p ../out
          ARGS="--out ../out/${{ matrix.fuente }}.json"
          if [ -z "$DATABASE_URL" ]; then ARGS="$ARGS --dry-run"; fi
          python -m ${{ matrix.fuente }} $ARGS 2>&1 | tee ../out/${{ matrix.fuente }}.log

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-${{ matrix.fuente }}
          path: out/
          if-no-files-found: ignore

      - name: Abrir issue si el scraper falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FUENTE="${{ matrix.fuente }}"
          TITLE="[scraper-roto] ${FUENTE^^} falló el $(date -u +%Y-%m-%d)"
          EXISTING=$(gh issue list --label scraper-roto --state open --search "$TITLE" --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING ya existe, no duplico."
            exit 0
          fi
          gh issue create \
            --title "$TITLE" \
            --label scraper-roto \
            --body "El workflow de ingesta de ${FUENTE^^} falló. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notificar:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"

      - name: Enviar alertas por email
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTAS_FROM: ${{ vars.ALERTAS_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ -z "$RESEND_API_KEY" ]; then ARGS="--dry-run"; fi
          python -m notificar $ARGS
