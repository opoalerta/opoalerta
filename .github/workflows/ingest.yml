name: Ingesta diaria

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC diario
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    strategy:
      fail-fast: false
      matrix:
        # bopa no está: el cortafuegos de Asturias no deja conectar a los
        # runners de GitHub. Corre en local con scrapers/local/bopa.sh (#140).
        fuente: [boe, boja, bocm, bocyl, boa, boib, epso, dog, boc, docm, doe, dogv, dogc, cido, bopv]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"

      - name: Ejecutar scraper ${{ matrix.fuente }}
        env:
          # Con el secret, la ingesta escribe en Postgres; sin él, dry-run.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          mkdir -p ../out
          ARGS="--out ../out/${{ matrix.fuente }}.json"
          if [ -z "$DATABASE_URL" ]; then ARGS="$ARGS --dry-run"; fi
          python -m ${{ matrix.fuente }} $ARGS 2>&1 | tee ../out/${{ matrix.fuente }}.log

      - name: Subir artefacto
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingest-${{ matrix.fuente }}
          path: out/
          if-no-files-found: ignore

      # Una issue por fuente, no una por día. El título llevaba la fecha, así
      # que la deduplicación solo funcionaba dentro del mismo día: tres días de
      # fallos dejaban tres issues. Cada fallo nuevo añade un comentario a la
      # que ya está abierta.
      - name: Abrir o actualizar issue si el scraper falla
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FUENTE="${{ matrix.fuente }}"
          TITLE="[scraper-roto] ${FUENTE^^}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Falló el $(date -u +%Y-%m-%d). Run: $RUN_URL"

          EXISTING=$(gh issue list --label scraper-roto --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING ya abierta para $FUENTE; añado el fallo de hoy."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create \
              --title "$TITLE" \
              --label scraper-roto \
              --body "El scraper de ${FUENTE^^} está fallando.

          $BODY"
          fi

      # Sin esto nadie las cerraba: las cuatro issues abiertas el 31 de julio
      # correspondían a roturas ya arregladas días antes.
      - name: Cerrar la issue si el scraper vuelve a funcionar
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FUENTE="${{ matrix.fuente }}"
          TITLE="[scraper-roto] ${FUENTE^^}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          EXISTING=$(gh issue list --label scraper-roto --state open \
            --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Recuperado: la ingesta de ${FUENTE^^} ha vuelto a completarse. Run: $RUN_URL"
          fi

  enriquecer:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"
      - name: Enriquecer plazos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLAZO_BATCH: "80"
        run: python -m enriquecer

  revalidar:
    # Publica lo nuevo en cuanto está enriquecido y, acto seguido, vuelve a
    # pedir todo lo que acaba de invalidar. Sin ese segundo paso los ~570
    # listados se regeneraban uno a uno durante el día, al paso de los
    # rastreadores, y el compute de Neon no llegaba a suspenderse nunca.
    # Sin el secreto se salta: la web sigue, solo tarda más.
    needs: [ingest, enriquecer]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Lo normal son dos o tres minutos. Si la web va lenta, mejor cortar que
    # tener al runner una hora martilleando la base.
    timeout-minutes: 15
    steps:
      - name: Invalidar la caché de la web y regenerarla
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::warning::REVALIDATE_SECRET no configurado; la web se actualizará en ≤7 días"
            exit 0
          fi
          BASE="${SITE_URL:-https://opoalerta.es}"
          respuesta=$(curl -fsS --retry 3 -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            "$BASE/api/revalidar")
          echo "$respuesta" | jq -c 'del(.rutas)'

          # Listados del sitemap (todo menos las fichas, que son miles y no se
          # han invalidado) más las fichas recién ingeridas y el RSS.
          {
            curl -fsS --retry 3 "$BASE/sitemap.xml" \
              | grep -o '<loc>[^<]*' | sed 's/<loc>//' | grep -v '/convocatoria/'
            echo "$respuesta" | jq -r --arg base "$BASE" '.rutas[]? | $base + .'
            echo "$BASE/rss.xml"
          } | sort -u > urls.txt
          echo "Regenerando $(wc -l < urls.txt) páginas"
          # Un fallo aquí no rompe nada: la página se regenera con la primera visita.
          xargs -P 4 -n 1 curl -s -o /dev/null --max-time 60 -A "opoalerta-calentar" < urls.txt || true

  notificar:
    # Tras el enriquecimiento: el aviso de cierre lee fecha_fin_plazo, que lo
    # calcula ese paso. `!cancelled()` lo lanza aunque el enriquecimiento falle.
    needs: [ingest, enriquecer]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"

      - name: Enviar alertas (email y Telegram)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERTAS_FROM: ${{ vars.ALERTAS_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ -z "$RESEND_API_KEY" ] && [ -z "$TELEGRAM_BOT_TOKEN" ]; then ARGS="--dry-run"; fi
          python -m notificar $ARGS
