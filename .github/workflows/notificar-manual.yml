name: Enviar alertas (manual)

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar el guard de 12h (reenviar aunque se notificara hace poco)"
        type: boolean
        default: true

jobs:
  notificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - name: Tailscale (Postgres del VPS)
        # La base vive en un VPS y solo escucha en la red privada de Tailscale.
        # tag:ci solo puede llegar al 5432 de ese servidor (política del tailnet).
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"

      - name: Enviar alertas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERTAS_FROM: ${{ vars.ALERTAS_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m notificar $ARGS
