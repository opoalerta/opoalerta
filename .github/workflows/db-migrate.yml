name: Migrar base de datos

on:
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tailscale (Postgres del VPS)
        # La base vive en un VPS y solo escucha en la red privada de Tailscale.
        # tag:ci solo puede llegar al 5432 de ese servidor (política del tailnet).
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Aplicar esquema (data/schema/*.sql en orden)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL"
            exit 1
          fi
          for f in $(ls data/schema/*.sql | sort); do
            echo "── Aplicando $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo "── Tablas resultantes:"
          psql "$DATABASE_URL" -c "\dt"
