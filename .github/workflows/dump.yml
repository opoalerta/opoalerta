name: Dump de datos

on:
  schedule:
    - cron: "0 4 1 * *" # día 1 de cada mes, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scrapers
    steps:
      - uses: actions/checkout@v7
      - name: Tailscale (Postgres del VPS)
        # La base vive en un VPS y solo escucha en la red privada de Tailscale.
        # tag:ci solo puede llegar al 5432 de ese servidor (política del tailnet).
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[db]"

      - name: Exportar convocatorias
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m exportar --out ../out

      - name: Publicar dump en Releases
        if: ${{ hashFiles('out/convocatorias.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="datos-$(date -u +%Y-%m)"
          NOTES="Volcado mensual de convocatorias normalizadas de OpoAlerta. Licencia ODbL-1.0 (data/LICENSE), con atribución a las fuentes oficiales (BOE y boletines autonómicos)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ../out/convocatorias.csv ../out/convocatorias.json --clobber
          else
            gh release create "$TAG" ../out/convocatorias.csv ../out/convocatorias.json \
              --title "Datos $(date -u +%Y-%m)" --notes "$NOTES"
          fi
