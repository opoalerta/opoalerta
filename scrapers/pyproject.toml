[project]
name = "opoalerta-scrapers"
version = "0.1.0"
description = "Scrapers de convocatorias de empleo público para OpoAlerta"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "psycopg[binary]>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common"]
py-modules = ["boe", "boja", "bocm", "bocyl", "boa", "notificar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
